# This is a Databricks asset bundle definition for car_workshop_ab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: car_workshop_ab
  uuid: 3226a479-b918-4e68-ba03-2a25b52d685f

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8483cccd-ac5f.cloud.databricks.com
    variables:
      catalog: car_workshop
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8483cccd-ac5f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/moustache.data.car.service@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/moustache.data.car.service@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: car_workshop
      schema: prod
    permissions:
      - user_name: moustache.data.car.service@gmail.com
        level: CAN_MANAGE
