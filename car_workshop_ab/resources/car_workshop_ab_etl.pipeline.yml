# The main pipeline for car_workshop_ab

resources:
  pipelines:
    car_workshop_ab_etl:
      name: car_workshop_ab_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/car_workshop_ab_etl"

      libraries:
        - glob:
            include: ../src/car_workshop_ab_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
