name: Deploy docs

on:
  push:
    branches: ["main"] # Pages publishes from main - changes arrive via PR
    paths: # anything that changes what the page derives its data from
      - "docs/**"
      - "table_schemas.py"
      - "api/**"
      - "scripts/build_docs_data.py"
  workflow_dispatch:

# Pages deployment needs these; the default GITHUB_TOKEN has none of them
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true # a newer deploy supersedes a running one

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Rebuild derived docs data # page facts come from code, not memory
        run: |
          pip install -r api/requirements.txt
          python scripts/build_docs_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0
